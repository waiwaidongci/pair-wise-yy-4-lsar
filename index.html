<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>水下考古潜水记录</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, "PingFang SC", sans-serif; background: #e8f2f3; color: #183035; }
    header { padding: 18px 24px; background: #fff; border-bottom: 1px solid #c9dadc; display: flex; justify-content: space-between; gap: 16px; align-items: center; }
    h1 { margin: 0; font-size: 26px; }
    h2 { margin: 12px 0 6px; font-size: 17px; }
    button { border: 0; border-radius: 8px; padding: 10px 13px; background: #1d6c78; color: #fff; font-weight: 800; cursor: pointer; }
    button.secondary { background: #64777b; }
    input, select, textarea { width: 100%; border: 1px solid #c9dadc; border-radius: 6px; padding: 9px; font: inherit; background: #fff; }
    textarea { min-height: 64px; }
    label { display: block; margin: 9px 0 5px; color: #5c7378; font-size: 13px; }
    .actions { display: flex; gap: 8px; }
    .app { display: grid; grid-template-columns: 1fr 380px; gap: 16px; padding: 16px; }
    .panel { background: #fff; border: 1px solid #c9dadc; border-radius: 8px; padding: 14px; }
    .map { position: relative; height: calc(100vh - 128px); min-height: 560px; overflow: hidden; background: radial-gradient(circle at 30% 20%, #5fa8b1, #0f5262 55%, #07333f); border-radius: 8px; border: 1px solid #0c4451; cursor: crosshair; }
    .wreck { position: absolute; left: 24%; top: 28%; width: 52%; height: 31%; border: 3px solid rgba(220,235,224,.55); border-radius: 48% 44% 42% 50%; transform: rotate(-9deg); }
    .rib { position: absolute; width: 2px; height: 36%; background: rgba(220,235,224,.35); top: 27%; transform: rotate(-9deg); }
    .marker { position: absolute; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 800; transform: translate(-50%, -50%); border: 2px solid rgba(255,255,255,.7); box-shadow: 0 4px 12px rgba(0,0,0,.35); cursor: pointer; }
    .marker.selected { outline: 4px solid rgba(255,234,124,.75); }
    .marker.conflict { outline: 3px dashed #ffb03a; }
    .ceramic { background: #b56c38; } .wood { background: #6c4b2f; } .metal { background: #6e7880; } .unknown { background: #725ca6; }
    .toolbar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
    .tab-btn { flex: 1; background: #e3eef0; color: #17505a; }
    .tab-btn.active { background: #1d6c78; color: #fff; }
    .tab-page { display: none; }
    .tab-page.active { display: block; }
    .list { display: grid; gap: 8px; max-height: 330px; overflow: auto; }
    .timeline { display: grid; gap: 8px; max-height: 240px; overflow: auto; }
    .stack { display: grid; gap: 8px; max-height: 300px; overflow: auto; }
    .item { border: 1px solid #d7e4e5; border-radius: 8px; padding: 10px; cursor: pointer; }
    .item.active { border-color: #1d6c78; background: #eef8f9; }
    .pill { display: inline-block; padding: 3px 8px; border: 1px solid #c9dadc; border-radius: 999px; font-size: 12px; }
    .pill.warn { background: #fff3d6; border-color: #e5c15c; color: #7a5b00; }
    .muted { color: #5c7378; font-size: 13px; }
    .rowops { display: flex; gap: 6px; margin-top: 6px; }
    .rowops button { padding: 6px 10px; font-size: 12px; }
    .cfl-card { border: 1px solid #e5c15c; background: #fffaf0; border-radius: 8px; padding: 10px; display: grid; gap: 8px; }
    .cfl-vals { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .cfl-vals > div { background: #fff; border: 1px solid #eee2c0; border-radius: 6px; padding: 8px; display: grid; gap: 3px; }
    .cfl-ops { display: flex; gap: 8px; }
    .cfl-ops button { flex: 1; }
    .batch-item { border: 1px solid #d7e4e5; border-radius: 8px; padding: 10px; display: grid; gap: 2px; }
    .devrow { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; }
    #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #183035; color: #fff; padding: 10px 16px; border-radius: 8px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 9; max-width: 84vw; }
    #toast.show { opacity: .95; }
    @media (max-width: 980px) { header { display: block; } .app { grid-template-columns: 1fr; } .map { height: 560px; } }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>水下考古潜水记录</h1>
      <div class="muted" id="deviceLabel">离线合并已启用</div>
    </div>
    <div class="actions">
      <button id="exportBtn">导出批次</button>
      <button id="importBtn" class="secondary">导入批次</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
  </header>
  <main class="app">
    <section class="panel">
      <div class="map" id="map"><div class="wreck"></div></div>
    </section>
    <aside class="panel">
      <div class="tabs">
        <button class="tab-btn active" data-tab="marks">标记</button>
        <button class="tab-btn" data-tab="dives">潜次</button>
        <button class="tab-btn" data-tab="sync" id="syncTabBtn">同步</button>
      </div>

      <div class="tab-page active" id="tab-marks">
        <div class="toolbar">
          <select id="filter"><option value="">全部类型</option><option value="ceramic">陶片</option><option value="wood">木构件</option><option value="metal">金属件</option><option value="unknown">未知物</option></select>
          <select id="view"><option value="list">标记列表</option><option value="timeline">潜次时间线</option></select>
        </div>
        <form id="form">
          <h2>标记信息</h2>
          <input name="rowId" type="hidden">
          <label>编号</label><input name="code" required>
          <label>类型</label><select name="type"><option value="ceramic">陶片</option><option value="wood">木构件</option><option value="metal">金属件</option><option value="unknown">未知物</option></select>
          <label>潜次</label><select name="diveId" required></select>
          <label>深度</label><input name="depth" placeholder="例如18.4m" required>
          <label>朝向</label><input name="orientation" placeholder="例如东北偏北">
          <label>保存状态</label><input name="condition" placeholder="例如表面附着贝类">
          <label>备注</label><textarea name="note"></textarea>
          <div class="muted" id="markProv"></div>
          <div class="toolbar"><button>保存标记</button><button type="button" id="deleteBtn" class="secondary">撤掉</button></div>
        </form>
        <h2 id="listTitle">标记列表</h2>
        <div id="list" class="list"></div>
      </div>

      <div class="tab-page" id="tab-dives">
        <form id="diveForm">
          <h2>潜次信息</h2>
          <input name="rowId" type="hidden">
          <label>潜次编号</label><input name="code" placeholder="例如DIVE-04" required>
          <label>日期</label><input name="date" placeholder="例如2026-10-03">
          <label>船/站点</label><input name="vessel" placeholder="例如分队船二 / 岸基整理室">
          <label>备注</label><textarea name="note"></textarea>
          <div class="toolbar"><button>保存潜次</button><button type="button" id="diveResetBtn" class="secondary">清空</button></div>
        </form>
        <h2>潜次列表</h2>
        <div id="diveList" class="list"></div>
      </div>

      <div class="tab-page" id="tab-sync">
        <h2>本机设备</h2>
        <div class="devrow">
          <div><label>设备名称</label><input id="devName"></div>
          <button id="saveDevName" class="secondary">保存</button>
        </div>
        <div class="muted">设备号 <span id="devId"></span> · 已记录操作 <span id="opCount"></span> 条</div>
        <div class="muted" style="margin-top:6px">「导出批次」生成 JSON 文件，拷到对方设备后用「导入批次」合并；同一批次重复导入不会重复落账。</div>
        <h2>挂起冲突 <span class="muted" id="cflHint"></span></h2>
        <div id="conflictList" class="stack"></div>
        <h2>导入批次记录</h2>
        <div id="batchList" class="stack"></div>
      </div>
    </aside>
  </main>
  <div id="toast"></div>
  <script src="js/sync.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
